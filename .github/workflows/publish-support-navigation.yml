name: Publish public support navigation

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Latest successful original Pages build whose data snapshot must be preserved"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'henryli777/google_ssr_actions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify original build provenance
        run: python verify_publication.py
      - name: Download only original public artifact
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name github-pages --dir snapshot
          python - <<'PY'
          import tarfile
          with tarfile.open('snapshot/artifact.tar') as archive:
              archive.extractall('dist', filter='data')
          PY
      - name: Update public UI without refreshing or modifying original data
        run: |
          python -m unittest test_project_support test_publish_safety -v
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from project_support import PUBLIC_PAGES, apply_to_directory
          root = Path('dist')
          assert (root / 'index.html').is_file()
          before = {path.relative_to(root): sha256(path.read_bytes()).hexdigest() for path in root.rglob('*') if path.is_file()}
          apply_to_directory(root, upgrade_public_pages=True)
          allowed = set(PUBLIC_PAGES) | {'404.html', 'public-refresh.js'}
          for name, digest in before.items():
              if str(name) not in allowed:
                  assert sha256((root / name).read_bytes()).hexdigest() == digest, f'Unexpected snapshot change: {name}'
          print('Original non-public-page files preserved:', sum(str(name) not in allowed for name in before))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Recheck latest successful source immediately before deployment
        run: python verify_publication.py
      - name: Deploy original snapshot with updated navigation
        id: deployment
        uses: actions/deploy-pages@v4
