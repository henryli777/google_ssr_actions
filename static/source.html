<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>订阅源详情</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; margin:0; background:#0f172a; color:#e5e7eb; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 20px; }
    .card { background:#111827; border:1px solid #1f2937; border-radius:14px; padding:16px; overflow-wrap:anywhere; }
    h1 { font-size: 20px; margin:0 0 10px 0; }
    code { background:#0b1220; padding:2px 6px; border-radius:6px; border:1px solid #1f2937; color:#d1d5db; }
    textarea { box-sizing:border-box; width:100%; min-height: 380px; background:#0b1220; color:#e5e7eb; border:1px solid #1f2937; border-radius:12px; padding:10px; }
    a { color:#60a5fa; text-decoration:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>订阅源详情</h1>
      <div id="meta"><small>加载中...</small></div>
      <p id="actions"></p>
      <textarea id="nodes" readonly>加载中...</textarea>
    </div>
  </div>
  <script>
    function copyText(t){ navigator.clipboard.writeText(t).then(()=>alert('已复制')).catch(()=>{}); }
    function renderSource(meta, txt){
      const container = document.getElementById('meta');
      container.replaceChildren();
      const fields = [
        ['机场', meta.provider || meta.host || ''], ['URL', meta.url || ''],
        ['节点', meta.nodes_total || 0],
        ['协议', Object.entries(meta.protocol_counts || {}).map(([k,v])=>k+':'+v).join(', ') || '-'],
        ['流量', (meta.traffic?.remaining ?? '-') + ' / ' + (meta.traffic?.total ?? '-') + ' ' + (meta.traffic?.unit ?? '')],
        ['延迟', (meta.response_ms ?? '-') + ' ms'], ['更新', meta.updated_at || '-']
      ];
      for(const [label,value] of fields){
        const row = document.createElement('div');
        row.textContent = label + '：' + value;
        if(label === 'URL' && /^https?:\/\//i.test(value)){
          row.textContent = label + '：';
          const link = document.createElement('a');
          link.textContent = value;
          link.href = value;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          row.append(link);
        }
        container.append(row);
      }
      const actions = document.getElementById('actions');
      if(!actions.firstChild){
        const copy = document.createElement('button');
        copy.textContent = '复制订阅链接';
        copy.addEventListener('click', () => copyText(actions.dataset.url));
        actions.append(copy);
      }
      actions.dataset.url = meta.url || '';
      GoogleSSRRefresh.preserveText(document.getElementById('nodes'), txt);
    }
  </script>
</body>
</html>
